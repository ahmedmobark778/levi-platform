<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levi | WhatsApp Bot Platform</title>
<style>
:root{--bg:#05070d;--panel:#0b1120;--line:#1a2744;--blue:#1e90ff;--cyan:#00e5ff;--text:#e8f2ff;--muted:#7a90b5;--green:#2ecc71;--red:#ff4d6d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% -10%,#0a1832 0,transparent 50%),var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh}
button,input,select{font:inherit;font-family:inherit;outline:none}
.smallbtn{margin-left:6px}
button{cursor:pointer;border:0;color:white;transition:all .2s}
.hidden{display:none!important}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px}
.login-box{background:linear-gradient(145deg,#0b1120,#050a15);border:1px solid var(--line);border-radius:24px;padding:38px 32px;width:100%;max-width:420px}
.login-box h1{text-align:center;font-size:32px;margin-bottom:6px;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.login-box .sub{text-align:center;color:var(--muted);margin-bottom:28px;font-size:13px}
.field{display:grid;gap:8px;margin:15px 0}
.field label{color:#a8c0e0;font-size:13px;font-weight:500}
.field input{width:100%;padding:13px 15px;border-radius:12px;background:#070c18;border:1px solid #1e2d4d;color:white}
.primary{background:linear-gradient(110deg,#1e90ff,#00bfff);border-radius:12px;padding:14px 20px;width:100%;font-weight:700;font-size:15px}
.secondary{background:#0f1830;border:1px solid #1e2d4d;border-radius:12px;padding:12px 16px;color:#a8c0e0}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#070c18,#050810);border-left:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:12px;padding:8px 4px 22px;border-bottom:1px solid #14213d}
.brand .logo{font-size:36px;color:var(--blue);filter:drop-shadow(0 0 12px var(--blue))}
.brand strong{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav{display:grid;gap:6px}
nav button{background:transparent;text-align:right;padding:13px 16px;border-radius:12px;color:#8aa3c8;border:1px solid transparent}
nav button.active,nav button:hover{background:linear-gradient(100deg,rgba(30,144,255,.15),rgba(0,191,255,.08));border-color:rgba(30,144,255,.5);color:var(--cyan)}
.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(5,8,16,.85)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));font-size:20px}
.content{padding:28px;max-width:1300px;margin:auto}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 16px}
.sectionhead h2{font-size:22px}
.card{background:linear-gradient(145deg,#0b1120,#070c18);border:1px solid var(--line);border-radius:18px;padding:22px}
.bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;border:1px solid #1a2744;border-radius:14px;margin-bottom:10px;background:#070c18}
.botname{font-weight:700;font-size:16px;color:var(--cyan)}
.botmeta{font-size:12px;color:var(--muted);margin-top:6px}
.smallbtn{background:#0f1830;border:1px solid #1e2d4d;border-radius:8px;padding:8px 12px;font-size:12px;color:#a8c0e0}
.smallbtn.green{color:#7dffb0;border-color:rgba(46,204,113,.3)}
.smallbtn.danger{color:#ff8fa3;border-color:rgba(255,77,109,.3)}
.page{display:none}.page.active{display:block}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap}nav{display:flex;overflow-x:auto;width:100%}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.stat{text-align:center}.stat .num{font-size:32px;font-weight:800;color:var(--cyan)}.stat .lbl{color:var(--muted);font-size:13px;margin-top:4px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>⚡ LEVI</h1>
    <p class="sub">منصة إدارة بوتات واتساب</p>
    <div id="loginView">
      <div class="field"><label>👤 اسم المستخدم</label><input id="loginUser" placeholder="username" autocomplete="username"></div>
      <div class="field"><label>🔒 كلمة المرور</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="primary" onclick="doLogin()">🚀 تسجيل الدخول</button>
      <button class="secondary" style="width:100%;margin-top:10px" onclick="showRegister()">✨ إنشاء حساب جديد</button>
      <div id="loginError" style="color:var(--red);text-align:center;margin-top:10px"></div>
    </div>
    <div id="registerView" style="display:none">
      <div class="field"><label>👤 اسم المستخدم</label><input id="regUser" placeholder="حروف إنجليزية وأرقام" autocomplete="username"></div>
      <div class="field"><label>🔒 كلمة المرور</label><input id="regPass" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password"></div>
      <button class="primary" onclick="doRegister()">✨ إنشاء الحساب</button>
      <button class="secondary" style="width:100%;margin-top:10px" onclick="hideRegister()">← رجوع</button>
      <div id="regError" style="color:var(--red);text-align:center;margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="mainApp" class="layout hidden">
  <aside>
    <div class="brand"><div class="logo">⚡</div><div><strong>LEVI</strong><br><small>BOT PLATFORM</small></div></div>
    <nav id="nav">
      <button class="active" data-page="home">🏠 الرئيسية</button>
      <button data-page="bots">🤖 بوتاتي</button>
      <button data-page="create">➕ إنشاء بوت</button>
      <button data-page="users" id="navUsers" style="display:none">👥 المستخدمون</button>
    </nav>
    <div style="margin-top:auto"><button class="secondary" style="width:100%" onclick="doLogout()">🚪 تسجيل الخروج</button></div>
  </aside>
  <main>
    <header class="topbar">
      <span style="color:var(--muted)">لوحة التحكم / <b id="crumb" style="color:var(--cyan)">الرئيسية</b></span>
      <div class="user" style="display:flex;align-items:center;gap:10px"><div class="avatar">⚡</div><div><b id="currentUser" style="color:var(--cyan)">-</b></div></div>
    </header>
    <div class="content">
      <section class="page active" id="home">
        <div class="stats">
          <div class="card stat"><div class="num" id="statBots">0</div><div class="lbl">البوتات</div></div>
          <div class="card stat"><div class="num" id="statConnected">0</div><div class="lbl">المتصلة</div></div>
          <div class="card stat"><div class="num" id="statCommands">0</div><div class="lbl">الأوامر</div></div>
        </div>
        <div class="card" style="margin-top:20px">
          <h3 style="color:var(--cyan);margin-bottom:12px">👑 بيانات المطور</h3>
          <div id="devInfo" style="color:var(--muted);line-height:2">جاري التحميل...</div>
        </div>
      </section>
      <section class="page" id="bots">
        <div class="sectionhead"><h2>بوتاتي</h2><button class="primary" style="width:auto;padding:10px 20px" onclick="showPage('create')">➕ إضافة بوت</button></div>
        <div class="card"><div id="botList"><div style="color:var(--muted);text-align:center">جاري التحميل...</div></div></div>
      </section>
      <section class="page" id="create">
        <div class="sectionhead"><h2>إنشاء بوت جديد</h2></div>
        <div class="card" style="max-width:620px">
          <div class="field"><label>🏷 اسم البوت (اختياري)</label><input id="botName" placeholder="Levi" maxlength="40"></div>
          <div class="field"><label>📱 رقم واتساب (دولي)</label><input id="botPhone" placeholder="2010xxxxxxxx" inputmode="numeric"></div>
          <div class="field"><label>🔗 طريقة الربط</label><select id="botMethod"><option value="code">🔢 كود الاقتران</option><option value="qr">📷 رمز QR</option></select></div>
          <button class="primary" onclick="createBot()">✨ إنشاء البوت</button>
          <div id="createError" style="color:var(--red);text-align:center;margin-top:10px"></div>
        </div>
      </section>
      <section class="page" id="qrPage">
        <div class="sectionhead"><h2>ربط البوت</h2></div>
        <div class="card" style="text-align:center;max-width:500px;margin:auto">
          <div id="qrContent"><p style="color:var(--muted)">جاري التحميل...</p></div>
          <button class="secondary" style="margin-top:20px" onclick="showPage('bots')">← رجوع</button>
        </div>
      </section>
      <section class="page" id="users">
        <div class="sectionhead"><h2>👥 المستخدمون</h2></div>
        <div class="card"><div id="userList"><div style="text-align:center;color:var(--muted)">جاري التحميل...</div></div></div>
      </section>
      <div class="footer" style="text-align:center;color:var(--muted);font-size:12px;padding:30px">⚡ Levi © 2026 — تطوير <span id="footDev">Ahmed Mobark</span></div>
    </div>
  </main>
</div>

<script>
let token = localStorage.getItem('token') || '';
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let currentBots = [];
let pollTimer = null;
let activePage = 'home';
const labels = {home: 'الرئيسية', bots: 'بوتاتي', create: 'إنشاء بوت', users: 'المستخدمون', qrPage: 'ربط البوت'};

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function stopPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

function showPage(p) {
  activePage = p;
  if (p !== 'qrPage') stopPoll();
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('active', x.id === p));
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.page === p));
  document.getElementById('crumb').textContent = labels[p] || p;
  if (p === 'home') loadStats();
  if (p === 'bots') loadBots();
  if (p === 'users') loadUsers();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showPage(b.dataset.page)));

async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (r.status === 401 && token) { doLogout(); throw new Error('انتهت الجلسة'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('خطأ ' + r.status));
  return data;
}

function showRegister() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('registerView').style.display = 'block';
}

function hideRegister() {
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('registerView').style.display = 'none';
}

function saveSession(data) {
  token = data.token;
  currentUser = data.user;
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(currentUser));
  showApp();
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  if (!username || !password) { err.textContent = 'اكتب البيانات'; return; }
  try {
    saveSession(await api('/api/auth/login', {method: 'POST', body: JSON.stringify({username, password})}));
  } catch (e) { err.textContent = e.message; }
}

async function doRegister() {
  const username = document.getElementById('regUser').value.trim().toLowerCase();
  const password = document.getElementById('regPass').value;
  const err = document.getElementById('regError');
  err.textContent = '';
  if (!username || !password) { err.textContent = 'اكتب البيانات'; return; }
  try {
    saveSession(await api('/api/auth/register', {method: 'POST', body: JSON.stringify({username, password})}));
  } catch (e) { err.textContent = e.message; }
}

function doLogout() {
  stopPoll();
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  token = '';
  currentUser = null;
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  hideRegister();
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('currentUser').textContent = currentUser.username + (currentUser.role === 'admin' ? ' 👑' : '');
  document.getElementById('navUsers').style.display = currentUser.role === 'admin' ? '' : 'none';
  loadDeveloper();
  showPage('home');
}

async function loadDeveloper() {
  try {
    const d = (await api('/api/developer')).developer;
    document.getElementById('footDev').textContent = d.name;
    document.getElementById('devInfo').innerHTML =
      '<div>👤 الاسم: <b style="color:var(--text)">' + esc(d.name) + '</b></div>' +
      '<div>📱 الرقم: <b style="color:var(--text)">' + esc(d.phone) + '</b></div>' +
      '<div>💬 تليجرام: <a href="https://t.me/' + esc(d.telegram) + '" target="_blank" rel="noopener" style="color:var(--cyan)">@' + esc(d.telegram) + '</a></div>' +
      '<div>📢 قناة الواتساب: <a href="' + esc(d.waChannel) + '" target="_blank" rel="noopener" style="color:var(--cyan)">اضغط هنا</a></div>' +
      '<div>📢 قناة التليجرام: <a href="' + esc(d.tgChannel) + '" target="_blank" rel="noopener" style="color:var(--cyan)">اضغط هنا</a></div>';
  } catch (e) {
    document.getElementById('devInfo').textContent = e.message;
  }
}

async function loadStats() {
  try {
    const s = await api('/api/dashboard');
    document.getElementById('statBots').textContent = s.bots;
    document.getElementById('statConnected').textContent = s.connected;
    document.getElementById('statCommands').textContent = s.commands;
  } catch (e) {}
}

async function loadBots(silent) {
  const box = document.getElementById('botList');
  if (!silent) box.innerHTML = '<div style="color:var(--muted);text-align:center">جاري التحميل...</div>';
  try {
    currentBots = (await api('/api/bots')).bots || [];
    renderBots();
  } catch (e) {
    if (!silent) box.innerHTML = '<div style="color:var(--red)">' + esc(e.message) + '</div>';
  }
}

function renderBots() {
  const box = document.getElementById('botList');
  if (!currentBots.length) {
    box.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px">لا توجد بوتات بعد.</div>';
    return;
  }
  box.innerHTML = currentBots.map(b => {
    let text = 'غير متصل ❌';
    let color = 'var(--red)';
    if (b.status === 'connected') { text = 'متصل ✅'; color = 'var(--green)'; }
    else if (b.status !== 'disconnected') { text = 'جاري الربط... ⏳'; color = 'var(--cyan)'; }
    const connectLabel = b.status === 'disconnected' ? '🔗 ربط' : '👁 عرض الربط';
    const connectBtn = b.status === 'connected' ? '' : '<button class="smallbtn green" onclick="connectBot(' + b.id + ')">' + connectLabel + '</button>';
    const stopBtn = b.status === 'disconnected' ? '' : '<button class="smallbtn" onclick="disconnectBot(' + b.id + ')">⏏ فصل</button>';
    return '<div class="bot"><div><div class="botname">⚡ ' + esc(b.name) + '</div><div class="botmeta">' + esc(b.phone || 'بدون رقم') + '</div>' +
      '<div style="margin-top:10px">' + connectBtn + stopBtn + '<button class="smallbtn danger" onclick="removeBot(' + b.id + ')">🗑 حذف</button></div></div>' +
      '<div style="color:' + color + ';font-weight:bold;font-size:14px;padding:5px 10px;border:1px solid ' + color + ';border-radius:8px;background:rgba(0,0,0,0.2)">' + text + '</div></div>';
  }).join('');
}

async function createBot() {
  const name = document.getElementById('botName').value.trim() || 'Levi';
  const phone = document.getElementById('botPhone').value.replace(/\D/g, '');
  const method = document.getElementById('botMethod').value;
  const err = document.getElementById('createError');
  err.textContent = '';
  if (method === 'code' && !phone) { err.textContent = 'اكتب رقم الواتساب'; return; }
  try {
    await api('/api/bots', {method: 'POST', body: JSON.stringify({name, phone, method})});
    document.getElementById('botName').value = '';
    document.getElementById('botPhone').value = '';
    showPage('bots');
  } catch (e) { err.textContent = e.message; }
}

function renderConnection(c) {
  const box = document.getElementById('qrContent');
  if (c.status === 'connected') {
    stopPoll();
    box.innerHTML = '<p style="color:var(--green);font-size:20px;font-weight:bold">تم الربط بنجاح ✅</p>';
  } else if (c.qr) {
    box.innerHTML = '<p style="color:var(--muted);margin-bottom:15px">امسح الكود من واتساب</p><img alt="QR" src="' + c.qr + '" style="width:100%;max-width:250px;background:white;padding:10px;border-radius:10px">';
  } else if (c.pairingCode) {
    const code = String(c.pairingCode).replace(/^(.{4})(.+)$/, '$1-$2');
    box.innerHTML = '<p style="color:var(--muted);margin-bottom:15px">أدخل الكود في واتساب</p><div style="font-size:32px;letter-spacing:6px;color:var(--cyan);font-family:monospace;padding:20px;background:#070c18;border-radius:10px;direction:ltr">' + esc(code) + '</div>';
  } else if (c.status === 'disconnected') {
    stopPoll();
    box.innerHTML = '<p style="color:var(--red)">' + esc(c.message || 'البوت غير متصل') + '</p>';
  } else {
    box.innerHTML = '<p style="color:var(--muted)">' + esc(c.message || 'جاري الاتصال...') + '</p>';
  }
}

async function pollConnection(id) {
  try {
    renderConnection((await api('/api/bots/' + id + '/connection')).connection);
  } catch (e) {}
}

async function connectBot(id) {
  showPage('qrPage');
  document.getElementById('qrContent').innerHTML = '<p style="color:var(--muted)">جاري بدء الاتصال...</p>';
  try {
    renderConnection((await api('/api/bots/' + id + '/connect', {method: 'POST'})).connection);
    if (!pollTimer && activePage === 'qrPage') pollTimer = setInterval(() => pollConnection(id), 2000);
  } catch (e) {
    document.getElementById('qrContent').innerHTML = '<p style="color:var(--red)">خطأ: ' + esc(e.message) + '</p>';
  }
}

async function disconnectBot(id) {
  if (!confirm('فصل البوت؟ هيتمسح الربط الحالي.')) return;
  try { await api('/api/bots/' + id + '/disconnect', {method: 'POST'}); loadBots(); } catch (e) { alert(e.message); }
}

async function removeBot(id) {
  if (!confirm('حذف البوت؟')) return;
  try { await api('/api/bots/' + id, {method: 'DELETE'}); loadBots(); } catch (e) { alert(e.message); }
}

async function loadUsers() {
  const box = document.getElementById('userList');
  box.innerHTML = '<div style="color:var(--muted);text-align:center">جاري التحميل...</div>';
  try {
    const users = (await api('/api/admin/users')).users || [];
    box.innerHTML = users.map(u =>
      '<div class="bot"><div><div class="botname">👤 ' + esc(u.username) + (u.role === 'admin' ? ' 👑' : '') + '</div></div>' +
      (u.id === currentUser.id ? '' : '<button class="smallbtn danger" onclick="removeUser(' + u.id + ')">🗑 حذف</button>') + '</div>'
    ).join('');
  } catch (e) { box.innerHTML = '<div style="color:var(--red)">' + esc(e.message) + '</div>'; }
}

async function removeUser(id) {
  if (!confirm('حذف المستخدم وكل بوتاته؟')) return;
  try { await api('/api/admin/users/' + id, {method: 'DELETE'}); loadUsers(); } catch (e) { alert(e.message); }
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regPass').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

setInterval(() => {
  if (token && activePage === 'bots' && !document.hidden) loadBots(true);
}, 5000);

if (token && currentUser) showApp();
</script>
</body>
</html>
